name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  server:
    name: Server — lint / typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/prepview_test
          JWT_SECRET: super-secret-jwt-test-key-12345
          JWT_EXPIRES_IN: 7d
          GROQ_API_KEY: gsk_dummy_test_key

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/prepview_test
          JWT_SECRET: super-secret-jwt-test-key-12345
          JWT_EXPIRES_IN: 7d
          GROQ_API_KEY: gsk_dummy_test_key

  client:
    name: Client — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
